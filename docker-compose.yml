services:
  postgres:
    image: postgres:18-alpine
    container_name: aabha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aabha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aabha}
      POSTGRES_DB: ${POSTGRES_DB:-aabha} 
    expose:
      - "5432"
    volumes:
      
      - pgdata:/var/lib/postgresql 
      - ./src/aabha/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aabha} -d ${POSTGRES_DB:-aabha}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: aabha:latest
    container_name: aabha-api
    restart: unless-stopped
    # Keys come from .env; DATABASE_URL below overrides the host-facing one it
    # holds, because inside the network the database answers to "postgres".
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aabha}:${POSTGRES_PASSWORD:-aabha}@postgres:5432/${POSTGRES_DB:-aabha}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the slim image, and the venv's python is already on PATH.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent:
    build: .
    image: aabha:latest
    container_name: aabha-agent
    restart: unless-stopped
    # `start` is the production counterpart of the `lk agent dev` used on the
    # host - same worker, no reload, no console.
    command: ["python", "-m", "aabha.agent.entrypoint", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aabha}:${POSTGRES_PASSWORD:-aabha}@postgres:5432/${POSTGRES_DB:-aabha}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
