[project]
name = "aabha"
version = "0.1.0"
description = "An intelligent voice companion that understands context, remembers what matters, and helps you navigate everyday life."
readme = "README.md"
authors = [
    { name = "aayushghimirey", email = "ayushghimire077@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "livekit-agents>=1.7.0",
    "livekit-api>=1.2.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.build-backend]
# No __init__.py anywhere; the package is an implicit namespace package.
namespace = true
source-include = ["src/aabha/db/*.sql"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
