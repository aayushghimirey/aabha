org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Every Kotlin plugin (flutter_webrtc, device_info_plus, ...) was failing with
# "Could not close incremental caches ... class-fq-name-to-source.tab" on a
# clean tree. Those .tab files are memory-mapped, and releasing the mapping is
# what fails here. Incremental compilation buys rebuild speed; a build that
# finishes is worth more.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# AGP 9.0.1 calls 36 its highest tested compileSdk and warns about 37. The
# plugins require 37, so the warning is the price of building at all.
android.suppressUnsupportedCompileSdk=37

